# ai.wavegames.online → Next.js on 127.0.0.1:3005 (PM2: aiwave-front)
#
# Install on the Linux server (HTTP first — certificate files do not exist yet):
#   sudo cp deploy/nginx-ai.wavegames.online.conf /etc/nginx/sites-available/ai.wavegames.online
#   sudo ln -sfn /etc/nginx/sites-available/ai.wavegames.online /etc/nginx/sites-enabled/ai.wavegames.online
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ai.wavegames.online \
#     --email devsaqibmalik@gmail.com --agree-tos --non-interactive --redirect
#
# Certbot adds listen 443 and a certificate for THIS name only.
# Do not point ssl_certificate at /etc/letsencrypt/live/my.wavegames.online/.
# No allow/deny, no auth, no IP restriction — public site.

map $http_upgrade $aiwave_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.wavegames.online;

    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $aiwave_connection_upgrade;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
